name: Bias bot alerts

on:
  schedule:
    - cron: "10 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install numpy pandas requests yfinance websocket-client
      - name: Run bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          PROFILE: slk
        run: python bias_bot.py
      - name: Save sent-alerts state
        run: |
          git config user.name "bias-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state/sent_bias_alerts.json
          git diff --cached --quiet || git commit -m "Update sent-alert state [skip ci]"
          git push
